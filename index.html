<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Bro!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 90%;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem;
            color: #f43f5e;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        /* ছবির ফ্রেমের স্টাইল */
        .profile-container {
            width: 150px;
            height: 150px;
            margin: 15px auto;
            cursor: pointer;
            transition: transform 0.3s;
            overflow: hidden;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
        }

        .profile-container:hover {
            transform: scale(1.05);
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message {
            font-size: 1rem;
            line-height: 1.6;
            color: #e2e8f0;
            margin: 20px 0;
        }

        .btn {
            background: linear-gradient(45deg, #f43f5e, #fb7185);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
            transition: 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="container">
        <h1>শুভ জন্মদিন, ভাই! 🎉</h1>
        <p class="subtitle">Happy Birthday to the Best Brother!</p>
        
        <!-- কেকের জায়গায় ছবিটি সেট করা হয়েছে -->
        <div class="profile-container" id="profile" onclick="startFireworks()">
            <img src="bro.jpg" alt="Brother Picture" class="profile-pic">
        </div>

        <p class="message">
            আল্লাহ তোমার নতুন বছরটিকে সুস্বাস্থ্য, সাফল্য এবং প্রচুর খুশিতে ভরিয়ে দিক! 🎈✨
        </p>

        <button class="btn" onclick="startFireworks()">Celebrate 🥳</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                this.velocity = {
                    x: (Math.random() - 0.5) * 6,
                    y: (Math.random() - 0.5) * 6
                };
                this.alpha = 1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.01;
            }
        }

        function startFireworks() {
            const colors = ['#f43f5e', '#38bdf8', '#facc15', '#4ade80', '#c084fc'];
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * (canvas.height / 2);
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    for (let j = 0; j < 40; j++) {
                        particles.push(new Particle(x, y, color));
                    }
                }, i * 200);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((particle, index) => {
                if (particle.alpha > 0) {
                    particle.update();
                    particle.draw();
                } else {
                    particles.splice(index, 1);
                }
            });
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
